name: ZettaiOsunaYo
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.zettaiosunayo
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  ZettaiOsunaYo:
    type: application
    platform: iOS
    sources:
      - ZettaiOsunaYo
    resources:
      - ZettaiOsunaYo/Resources
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        INFOPLIST_FILE: ZettaiOsunaYo/Info.plist
        PRODUCT_NAME: ZettaiOsunaYo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ZettaiOsunaYo/Info.plist
      properties:
        CFBundleName: "絶対押すなよ"
        CFBundleDisplayName: "絶対押すなよ"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        ZETTAI_BOTTOM_BANNER_AD_UNIT_ID: "ca-app-pub-3940256099942544/2934735716"
        NSUserTrackingUsageDescription: "広告の表示と効果測定のために使用します。許可しなくてもアプリはそのまま使えます。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: "cstr6suwn9.skadnetwork"
          - SKAdNetworkIdentifier: "4fzdc2evr5.skadnetwork"
          - SKAdNetworkIdentifier: "2fnua5tdw4.skadnetwork"
          - SKAdNetworkIdentifier: "ydx93a7ass.skadnetwork"
